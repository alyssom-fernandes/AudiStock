<script>try{var t=localStorage.getItem('audistock-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<!-- Estilo embutido: esta página é servida em qualquer profundidade de URL
     (no GitHub Pages, sob /AudiStock/), então não depende de caminhos relativos. -->
<style>
  :root, [data-theme="dark"] { color-scheme: dark; --bg: #121211; --text: #eceae5; --muted: #aaa69d; --faint: #8d897f; --accent: #f08a4b; --on-accent: #1a0f05; --hover: #f5a06a; }
  [data-theme="light"] { color-scheme: light; --bg: #f6f5f2; --text: #1c1b19; --muted: #5c5850; --faint: #6b675e; --accent: #c2410c; --on-accent: #fff; --hover: #9a3412; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 400 14px/1.5 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 420px; text-align: center; }
  .marca { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 36px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .marca span { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .marca svg { width: 21px; height: 21px; }
  .codigo { font: 500 13px 'IBM Plex Mono', monospace; color: var(--faint); margin-bottom: 0; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 4px 0 8px; }
  p { color: var(--muted); margin-bottom: 22px; }
  a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 500; text-decoration: none; }
  a:hover { background: var(--hover); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="marca"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg></span>AudiStock</div>
  <p class="codigo">Erro 404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço não existe ou foi movido. Confira o link ou volte para o início.</p>
  <a id="inicio" href="/">Ir para o início</a>
</main>
<script>
  // No GitHub Pages de projeto o site mora em /<repositório>/
  if (location.hostname.endsWith('github.io')) {
    var repo = location.pathname.split('/')[1];
    if (repo) document.getElementById('inicio').href = '/' + repo + '/';
  }
</script>
</body>
</html>
