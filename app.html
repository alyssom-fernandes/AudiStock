<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AudiStock</title>
<script src="js/erros.js"></script>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- MODAIS GLOBAIS -->
<div class="modal-backdrop" id="modalAuditoria">
  <div class="modal">
    <div class="modal-title">Nova Auditoria</div>
    <div class="form-group"><label class="form-label">Empresa *</label><select class="form-input" id="audEmpresa"><option value="">Carregando...</option></select></div>
    <div class="form-group"><label class="form-label">Modo auditoria</label><select class="form-input" id="audModo"><option value="true">Cega — estoque oculto</option><option value="false">Visível — vê estoque</option></select></div>
    <div class="form-group"><label class="form-label">Observações</label><input class="form-input" type="text" id="audObs" placeholder="Ex: Auditoria quinzenal"/></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModalAud()">Cancelar</button><button class="btn btn-primary" id="btnCriarAud" onclick="criarAuditoria()">Iniciar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modalEmpresa">
  <div class="modal" style="width:480px">
    <div class="modal-title" id="modalEmpTitulo">Nova Empresa</div>
    <div style="margin-bottom:20px">
      <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="empNome"/></div>
      <div class="two-col">
        <div class="form-group"><label class="form-label">CNPJ</label><input class="form-input" id="empCnpj"/></div>
        <div class="form-group"><label class="form-label">UF</label><input class="form-input" id="empEstado" maxlength="2" style="text-transform:uppercase"/></div>
      </div>
      <div class="form-group"><label class="form-label">Cidade</label><input class="form-input" id="empCidade"/></div>
      <div class="form-group"><label class="form-label">Endereço</label><input class="form-input" id="empEndereco"/></div>
      <div class="form-group" style="margin-bottom:0"><label class="form-label">Observações</label><input class="form-input" id="empObs"/></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModalEmp()">Cancelar</button><button class="btn btn-primary" id="btnSalvarEmp" onclick="salvarEmpresa()">Salvar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modalProduto">
  <div class="modal" style="width:480px">
    <div class="modal-title" id="modalProdTitulo">Novo Produto</div>
    <div style="margin-bottom:20px">
      <div class="form-group"><label class="form-label">Empresa *</label><select class="form-input" id="prodEmpresa"></select></div>
      <div class="two-col">
        <div class="form-group"><label class="form-label">Código *</label><input class="form-input" id="prodCodigo" style="text-transform:uppercase"/></div>
        <div class="form-group"><label class="form-label">Unidade</label><input class="form-input" id="prodUnidade" style="text-transform:uppercase" maxlength="10"/></div>
      </div>
      <div class="form-group"><label class="form-label">Nome do Produto *</label><input class="form-input" id="prodNome"/></div>
      <div class="form-group" style="margin-bottom:0"><label class="form-label">Cód. Barras</label><input class="form-input" id="prodBarras"/></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModalProd()">Cancelar</button><button class="btn btn-primary" id="btnSalvarProd" onclick="salvarProduto()">Salvar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modalImport">
  <div class="modal" style="width:500px">
    <div class="modal-title">Importar Excel</div>
    <div class="modal-body">Colunas: <strong>codigo, nome, unidade, codigo_barras</strong>.</div>
    <div class="form-group"><label class="form-label">Empresa *</label><select class="form-input" id="importEmpresa"></select></div>
    <div class="form-group"><label class="form-label">Arquivo</label><input type="file" id="importArquivo" accept=".xlsx,.xls" class="form-input"/></div>
    <div id="importPreview" style="display:none;margin-bottom:14px"><div style="background:var(--surface-alt);border-radius:8px;padding:12px;font-size:13px" id="importPreviewText"></div></div>
    <div id="importResultado" style="display:none;margin-bottom:14px"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModalImport()">Fechar</button><button class="btn btn-primary" id="btnImportar" onclick="executarImportacao()">Importar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modalClonar">
  <div class="modal" style="width:480px">
    <div class="modal-title">Clonar Produtos</div>
    <div class="form-group"><label class="form-label">Origem *</label><select class="form-input" id="clonarOrigem"></select></div>
    <div class="form-group" style="margin-bottom:0"><label class="form-label">Destino *</label><select class="form-input" id="clonarDestino"></select></div>
    <div class="modal-actions" style="margin-top:20px"><button class="btn btn-ghost" onclick="fecharModalClonar()">Cancelar</button><button class="btn btn-primary" id="btnClonar" onclick="executarClone()">Clonar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modalUsuario">
  <div class="modal" style="width:480px">
    <div class="modal-title" id="modalUsrTitulo">Novo Usuário</div>
    <div style="margin-bottom:20px">
      <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="usrNome"/></div>
      <div class="form-group"><label class="form-label">E-mail *</label><input class="form-input" id="usrEmail" type="email"/></div>
      <div class="form-group" id="usrGrupoSenha"><label class="form-label">Senha *</label><input class="form-input" id="usrSenha" type="password" placeholder="Mínimo 6 caracteres"/></div>
      <div class="two-col">
        <div class="form-group"><label class="form-label">Perfil *</label><select class="form-input" id="usrRole"></select></div>
        <div class="form-group"><label class="form-label">Empresa</label><select class="form-input" id="usrEmpresa"><option value="">Acesso geral</option></select></div>
      </div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModalUsr()">Cancelar</button><button class="btn btn-primary" id="btnSalvarUsr" onclick="salvarUsuario()">Salvar</button></div>
  </div>
</div>

<!-- APP SHELL -->
<div class="app-shell" id="appShell">
  <div id="pageBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
import { requireAuth, getPerfil, hasRole, isSupremo } from './js/auth.js';
import { initLayout, showToast, showLoading, hideLoading, fmConfirm, escapeHtml, fmtDate, fmtDateTime, fmtNum, badgeStatus, badgeRole, badgeAtivo, debounce } from './js/ui.js';
import supabase from './js/supabaseClient.js';
import { listarAuditorias, buscarAuditoria, iniciarAuditoria, cancelarAuditoria, auditoriaEmAndamentoPorEmpresa, excluirAuditoria } from './js/auditorias.js';
import { listarEmpresas, buscarEmpresa, criarEmpresa, atualizarEmpresa, alternarStatusEmpresa, contarProdutosPorEmpresa } from './js/empresas.js';
import { listarProdutos, buscarProdutoPorId, criarProduto, atualizarProduto, importarProdutosExcel, clonarProdutos } from './js/produtos.js';
import { listarItensContados, historicoItem } from './js/contagem.js';

const auth = await requireAuth();
if (!auth) throw new Error('Não autenticado');

initLayout('Dashboard');
const perfil = getPerfil();
const pageBody = document.getElementById('pageBody');

function _params() { return new URLSearchParams(location.search); }
function irPara(tela, id = null) {
  const url = new URL(location.href);
  url.searchParams.set('tela', tela);
  if (id) url.searchParams.set('id', id); else url.searchParams.delete('id');
  history.pushState({}, '', url); _rotear();
}

async function _rotear() {
  const tela = _params().get('tela') || 'dashboard';
  const id = _params().get('id');

  const titulos = { dashboard: 'Dashboard', auditorias: 'Auditorias', historico: 'Histórico da Auditoria', empresas: 'Empresas', produtos: 'Produtos', usuarios: 'Usuários', relatorios: 'Relatórios', config: 'Configurações' };
  document.getElementById('topbarTitle').textContent = titulos[tela] ?? tela;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tela === tela));

  pageBody.innerHTML = '';
  switch (tela) {
    case 'dashboard': await renderDashboard(); break;
    case 'auditorias': await renderAuditorias(); break;
    case 'historico': await renderHistorico(id); break;
    case 'empresas': await renderEmpresas(); break;
    case 'produtos': await renderProdutos(); break;
    case 'usuarios': await renderUsuarios(); break;
    case 'relatorios': await renderRelatorios(); break;
    case 'config': await renderConfig(); break;
    default: await renderDashboard();
  }
}
window.addEventListener('popstate', _rotear);
document.addEventListener('click', e => { const item = e.target.closest('.nav-item[data-tela]'); if (item) { e.preventDefault(); irPara(item.dataset.tela); } });

// DASHBOARD
async function renderDashboard() {
  pageBody.innerHTML = `
    <div class="stat-grid" id="statGrid"></div>
    <div class="two-col" style="margin-bottom:16px">
      <div class="card"><div class="card-header"><span class="card-title">Em andamento</span><button class="btn btn-ghost btn-sm" onclick="irPara('auditorias')">Ver todas</button></div><div class="tabela-container" id="andamentoTable"><div class="empty-state"><div class="spinner" style="margin:auto"></div></div></div></div>
      <div class="card"><div class="card-header"><span class="card-title">Últimas Divergências</span><span class="label-tech" id="labelUltimaAud"></span></div><div class="card-body" id="graficoDiverg"><div class="spinner" style="margin:auto"></div></div></div>
    </div>
    <div class="two-col" style="margin-bottom:16px">
      <div class="card"><div class="card-header"><span class="card-title">Maiores faltas recentes</span></div><div class="tabela-container" id="topFaltasTable"><div class="spinner" style="margin:auto"></div></div></div>
      <div class="card"><div class="card-header"><span class="card-title">Maiores sobras recentes</span></div><div class="tabela-container" id="topSobrasTable"><div class="spinner" style="margin:auto"></div></div></div>
    </div>`;
  await Promise.all([_dashStats(), _dashAndamento(), _dashDivergencias()]);
}

async function _dashStats() {
  const [{ count: tEmp }, { count: tProd }, { count: eAnd }, { count: fin }] = await Promise.all([
    supabase.from('empresas').select('id',{count:'exact',head:true}).eq('ativo',true),
    supabase.from('produtos').select('id',{count:'exact',head:true}).eq('ativo',true),
    supabase.from('auditorias').select('id',{count:'exact',head:true}).eq('status','em_andamento'),
    supabase.from('auditorias').select('id',{count:'exact',head:true}).eq('status','finalizada')
  ]);
  const svgEmp = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>`;
  const svgProd = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4l7-4A2 2 0 0 0 21 16z"/></svg>`;
  const svgAnd = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`;
  const svgOk = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>`;
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="stat-icon">${svgEmp}</div><div class="stat-label">Empresas</div><div class="stat-value">${tEmp??0}</div></div>
    <div class="stat-card"><div class="stat-icon">${svgProd}</div><div class="stat-label">Produtos</div><div class="stat-value">${(tProd??0).toLocaleString()}</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--warning);background:var(--warning-light);border-color:rgba(234,179,8,0.3)">${svgAnd}</div><div class="stat-label">Em andamento</div><div class="stat-value">${eAnd??0}</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--success);background:var(--success-light);border-color:rgba(16,185,129,0.3)">${svgOk}</div><div class="stat-label">Finalizadas</div><div class="stat-value">${fin??0}</div></div>`;
}

async function _dashAndamento() {
  const { data } = await supabase.from('auditorias').select('id,numero_auditoria,data_inicio,empresas(nome)').eq('status','em_andamento').order('data_inicio',{ascending:false}).limit(5);
  const el = document.getElementById('andamentoTable');
  if (!data?.length) { el.innerHTML = `<div class="empty-state">Nenhuma auditoria ativa.</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>Nº</th><th>Empresa</th><th></th></tr></thead><tbody>${data.map(a=>`<tr><td class="mono">${escapeHtml(a.numero_auditoria)}</td><td>${escapeHtml(a.empresas?.nome)}</td><td><a class="btn btn-primary btn-sm" href="contagem.html?id=${a.id}">Abrir</a></td></tr>`).join('')}</tbody></table>`;
}

async function _dashDivergencias() {
  const { data: aud } = await supabase.from('auditorias').select('id,numero_auditoria,empresas(nome)').eq('status','finalizada').order('data_fim',{ascending:false}).limit(1).maybeSingle();
  const el = document.getElementById('graficoDiverg');
  if (!aud) { el.innerHTML = `<div class="empty-state">Sem dados.</div>`; document.getElementById('topFaltasTable').innerHTML = `<div class="empty-state">Sem dados.</div>`; document.getElementById('topSobrasTable').innerHTML = `<div class="empty-state">Sem dados.</div>`; return; }
  document.getElementById('labelUltimaAud').textContent = aud.numero_auditoria;
  const { data: itens } = await supabase.from('vw_relatorio_divergencias').select('*').eq('auditoria_id', aud.id);
  const sobras = itens?.filter(i=>i.status_divergencia==='sobra')??[], faltas = itens?.filter(i=>i.status_divergencia==='falta')??[], ok = itens?.filter(i=>i.status_divergencia==='ok')??[];
  const total = (sobras.length+faltas.length+ok.length)||1;
  const barra = (l,q,p,c) => `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;font-weight:600;color:${c}"><span>${l}</span><span class="mono">${q} (${Math.round(q/total*100)}%)</span></div><div class="progress"><div class="progress-fill" style="width:${Math.round(q/total*100)}%;background:${c}"></div></div></div>`;
  el.innerHTML = `${barra('Sobras',sobras.length,0,'var(--success)')}${barra('Faltas',faltas.length,0,'var(--danger)')}${barra('OK',ok.length,0,'var(--text-muted)')}<div style="text-align:right;margin-top:16px"><a href="relatorios.html?id=${aud.id}" class="btn btn-ghost btn-sm">Ver Relatório</a></div>`;
  _dashTopTabela('topFaltasTable', faltas.sort((a,b)=>Number(a.diferenca)-Number(b.diferenca)).slice(0,5), 'falta');
  _dashTopTabela('topSobrasTable', sobras.sort((a,b)=>Number(b.diferenca)-Number(a.diferenca)).slice(0,5), 'sobra');
}

function _dashTopTabela(elId, lista, tipo) {
  const el = document.getElementById(elId);
  if (!lista.length) { el.innerHTML = `<div class="empty-state">Nenhuma ${tipo}.</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>Produto</th><th>Diff</th></tr></thead><tbody>${lista.map(r=>`<tr><td><div style="font-weight:600">${escapeHtml(r.nome_produto)}</div><div class="mono">${escapeHtml(r.codigo_produto)}</div></td><td class="mono ${Number(r.diferenca)>0?'badge-green':'badge-red'}" style="background:transparent;border:none;">${Number(r.diferenca)>0?'+':''}${fmtNum(r.diferenca)}</td></tr>`).join('')}</tbody></table>`;
}

// AUDITORIAS
let _audFiltro = null;
async function renderAuditorias() {
  pageBody.innerHTML = `
    <div class="filters-bar">
      <button class="filter-btn active-all" onclick="_setFiltroAud(null,this)">Todas</button>
      <button class="filter-btn" onclick="_setFiltroAud('em_andamento',this)">Ativas</button>
      <button class="filter-btn" onclick="_setFiltroAud('finalizada',this)">Finalizadas</button>
      ${hasRole('administrador') ? `<button class="btn btn-primary" style="margin-left:auto" onclick="abrirModalNovaAud()">+ Nova Auditoria</button>` : ''}
    </div>
    <div class="card"><div class="tabela-container"><table><thead><tr><th>Nº</th><th>Empresa</th><th>Início</th><th>Status</th><th>Ações</th></tr></thead><tbody id="audTbody"><tr><td colspan="5" class="empty-state"><div class="spinner" style="margin:auto"></div></td></tr></tbody></table></div></div>`;
  await _carregarAuds();
  window._setFiltroAud = async (st, btn) => { _audFiltro = st; document.querySelectorAll('.filter-btn').forEach(b=>b.className='filter-btn'); btn.classList.add('active-all'); await _carregarAuds(); };
}

async function _carregarAuds() {
  const tbody = document.getElementById('audTbody'); if (!tbody) return;
  try {
    const { data } = await listarAuditorias({ status: _audFiltro, limit: 100 });
    if (!data.length) { tbody.innerHTML = `<tr class="tr-empty"><td colspan="5">Nenhuma auditoria encontrada.</td></tr>`; return; }
    tbody.innerHTML = data.map(a=>`<tr>
      <td class="mono" style="color:var(--primary); font-weight:700;">${escapeHtml(a.numero_auditoria)}</td>
      <td style="font-weight:600;">${escapeHtml(a.empresas?.nome)}</td>
      <td class="mono">${fmtDate(a.data_inicio)}</td>
      <td>${badgeStatus(a.status)}</td>
      <td><div style="display:flex;gap:6px">
        ${a.status==='em_andamento' ? `<a href="contagem.html?id=${a.id}" class="btn btn-primary btn-sm">Continuar</a>` : `<a href="relatorios.html?id=${a.id}" class="btn btn-ghost btn-sm">Relatório</a>`}
        <a href="#" class="btn btn-ghost btn-sm" onclick="irPara('historico','${a.id}')">Histórico</a>
        ${isSupremo() ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger); border-color:var(--danger-light);" onclick="_excluirAud('${a.id}','${a.numero_auditoria}')">Excluir</button>` : ''}
      </div></td>
    </tr>`).join('');
  } catch(err) { tbody.innerHTML = `<tr class="tr-empty"><td colspan="5">${err.message}</td></tr>`; }
}

window._excluirAud = async function(id, numero) {
  const ok = await fmConfirm({titulo: 'Atenção, Supremo!', msg: `Deseja APAGAR DEFINITIVAMENTE a auditoria ${numero}? Essa ação é irreversível.`, confirmTxt: 'Excluir', tipo: 'perigo'});
  if(!ok) return;
  showLoading();
  try { await excluirAuditoria(id, perfil.id); showToast('Auditoria Excluída!', 'success'); await _carregarAuds(); } 
  catch(err) { showToast('Erro: ' + err.message, 'error'); } finally { hideLoading(); }
};

window.abrirModalNovaAud = async () => { document.getElementById('modalAuditoria').classList.add('active'); const sel = document.getElementById('audEmpresa'); sel.innerHTML = '<option value="">Carregando...</option>'; try { const emps = await listarEmpresas({ apenasAtivas: true }); sel.innerHTML = emps.length ? emps.map(e=>`<option value="${e.id}">${escapeHtml(e.nome)}</option>`).join('') : '<option value="">Sem empresas</option>'; } catch(e){} };
window.fecharModalAud = () => document.getElementById('modalAuditoria').classList.remove('active');
window.criarAuditoria = async () => {
  const empresaId = document.getElementById('audEmpresa').value;
  const cega = document.getElementById('audModo').value === 'true';
  const obs = document.getElementById('audObs').value;
  
  if (!empresaId) return showToast('Selecione uma empresa', 'warning');
  showLoading();
  
  try {
    const emAnd = await auditoriaEmAndamentoPorEmpresa(empresaId);
    if (emAnd) { 
        hideLoading(); 
        const ir = await fmConfirm({titulo:'Aviso', msg:`A auditoria ${emAnd.numero_auditoria} já está ativa. Ir para ela?`, confirmTxt:'Ir', tipo:'info'}); 
        if(ir) window.location.href=`contagem.html?id=${emAnd.id}`; 
        return; 
    }
    const nova = await iniciarAuditoria({ empresaId, usuarioId: perfil.id, auditoriaCega: cega, observacoes: obs });
    window.location.href = `contagem.html?id=${nova.id}`;
  } catch(err) { showToast(err.message, 'error'); hideLoading(); }
};

// HISTÓRICO
async function renderHistorico(auditoriaId) {
  if (!auditoriaId) { irPara('auditorias'); return; }
  showLoading();
  try {
    const auditoria = await buscarAuditoria(auditoriaId);
    pageBody.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <div><div class="label-tech">Histórico da Auditoria</div><div class="topbar-title">${escapeHtml(auditoria.numero_auditoria)}</div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" onclick="irPara('auditorias')">← Voltar</button>
          ${auditoria.status === 'em_andamento' ? `<a href="contagem.html?id=${auditoriaId}" class="btn btn-primary">Continuar Contagem</a>` : `<a href="relatorios.html?id=${auditoriaId}" class="btn btn-primary">Ver Relatório</a>`}
        </div>
      </div>
      <div class="card"><div class="card-header"><span class="card-title">Itens Contados</span></div><div class="tabela-container"><table><thead><tr><th>Código</th><th>Produto</th><th>Qtd</th><th>Data</th></tr></thead><tbody id="histItensTbody"><tr><td colspan="4" class="empty-state"><div class="spinner" style="margin:auto"></div></td></tr></tbody></table></div></div>
    `;
    const { data } = await listarItensContados(auditoriaId, { limit: 5000 });
    const tbody = document.getElementById('histItensTbody');
    if (!data.length) tbody.innerHTML = `<tr class="tr-empty"><td colspan="4">Nenhum item contato.</td></tr>`;
    else tbody.innerHTML = data.map(i => `<tr><td class="mono">${escapeHtml(i.produtos?.codigo_produto)}</td><td>${escapeHtml(i.produtos?.nome_produto)}</td><td class="mono" style="color:var(--primary); font-weight:700;">${fmtNum(i.quantidade_contada)}</td><td class="mono">${fmtDateTime(i.data_registro)}</td></tr>`).join('');
  } catch (err) { showToast(err.message, 'error'); irPara('auditorias'); } finally { hideLoading(); }
}

// EMPRESAS
let _empEditandoId = null, _empBusca = '';
async function renderEmpresas() {
  pageBody.innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
      <input class="form-input" style="width:280px" id="empCampoBusca" placeholder="Buscar empresa..." oninput="_onBuscaEmp(this.value)"/>

    if (_relBusca) lista = lista.filter(a => a.numero_auditoria.toLowerCase().includes(_relBusca) || (a.empresas?.nome ?? '').toLowerCase().includes(_relBusca));
    if (!lista.length) { tbody.innerHTML = `<tr class="tr-empty"><td colspan="5">Nenhum relatório encontrado.</td></tr>`; return; }
    tbody.innerHTML = lista.map(a => `<tr><td class="mono" style="color:var(--primary)">${escapeHtml(a.numero_auditoria)}</td><td style="font-weight:600;">${escapeHtml(a.empresas?.nome)}</td><td class="label-tech">${escapeHtml(a.usuarios?.nome)}</td><td class="mono">${fmtDate(a.data_fim)}</td><td><div style="display:flex;gap:6px"><a href="relatorios.html?id=${a.id}" class="btn btn-primary btn-sm">Abrir PDF / CSV</a></div></td></tr>`).join('');
  } catch(err) { tbody.innerHTML = `<tr class="tr-empty"><td colspan="5">${err.message}</td></tr>`; }
}

// CONFIGURAÇÕES
async function renderConfig() {
  pageBody.innerHTML = `
    <div style="max-width:680px;display:flex;flex-direction:column;gap:20px">
      <div class="card"><div class="card-header"><span class="card-title">Meu perfil</span></div><div class="card-body">
        <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="cfgNome" value="${escapeHtml(perfil?.nome??'')}"/></div>
        <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" value="${escapeHtml(perfil?.email??'')}" readonly style="opacity:.6;cursor:not-allowed"/></div>
        <button class="btn btn-primary" onclick="cfgSalvarNome()">Salvar</button>
      </div></div>
      <div class="card"><div class="card-header"><span class="card-title">Sistema</span><button class="btn btn-ghost btn-sm" onclick="errosLimpar()">Limpar registro</button></div><div class="card-body" id="cfgErros"></div></div>
    </div>`;
  _renderErros();
}
function _renderErros() {
  const el = document.getElementById('cfgErros'); if (!el) return;
  const erros = window.errosRegistrados?.() ?? [];
  el.innerHTML = !erros.length
    ? `<div style="color:var(--text-muted)">Nenhum erro registrado neste navegador.</div>`
    : `<div style="display:flex;flex-direction:column;gap:12px">${erros.map(e => `<div><div class="mono">${fmtDateTime(e.ts)} · ${escapeHtml(e.pagina)} · ${escapeHtml(e.tipo)}</div><div>${escapeHtml(e.msg)}</div></div>`).join('')}</div>`;
}
document.addEventListener('audistock:erros', _renderErros);
window.cfgSalvarNome = async()=>{ const nome=document.getElementById('cfgNome').value.trim(); if(!nome)return; showLoading(); try{ await supabase.from('usuarios').update({nome}).eq('id',perfil.id); showToast('Nome atualizado!','success'); }catch(e){}finally{hideLoading();} };

// FECHAR MODAL CLICANDO FORA
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('active')); });
document.addEventListener('click', e => { if (e.target.classList.contains('modal-backdrop')) e.target.classList.remove('active'); });

window.irPara = irPara;
await _rotear();
</script>
