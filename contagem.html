<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contagem — AudiStock</title>
<script src="js/erros.js"></script>
<link rel="stylesheet" href="css/style.css"/>
<style>
.main { padding: 40px; max-width: 1400px; margin: 0 auto; }
#scannerContainer { position: relative; background: #000; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; display: none; border: 1px solid var(--border-strong); }
#scannerVideo { width: 100%; max-height: 220px; object-fit: cover; display: block; }
#scannerOverlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
#scannerOverlay::before { content: ''; width: 200px; height: 100px; border: 2px solid var(--primary); border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,.6); }
#scannerLine { position: absolute; width: 200px; height: 2px; background: var(--primary); animation: scanLine 1.8s ease-in-out infinite; box-shadow: 0 0 10px var(--primary-glow); }
@keyframes scanLine { 0% { top: calc(50% - 49px); } 50% { top: calc(50% + 49px); } 100% { top: calc(50% - 49px); } }
</style>
</head>
<body>

<div class="modal-backdrop" id="conflictModal" style="z-index: 5000;">
  <div class="modal">
    <div class="modal-title">Produto já auditado</div>
    <div class="modal-body" id="conflictMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="resolverConflito('somar')">Somar</button>
      <button class="btn btn-primary" onclick="resolverConflito('sobrescrever')">Sobrescrever</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="editModal" style="z-index: 5000;">
  <div class="modal">
    <div class="modal-title">Editar Contagem</div>
    <div class="modal-body">
      <p id="editProdName" style="font-weight: 700; margin-bottom: 16px; color: var(--text);"></p>
      <div class="form-group"><label class="form-label">Nova Quantidade</label><input type="number" class="input-field" id="editQtd" step="0.01" min="0"/></div>
      <div class="form-group"><label class="form-label">Motivo (Opcional)</label><input type="text" class="input-field" id="editMotivo" placeholder="Ex: Correção de leitura"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharEdicao()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>

<div class="app-shell" id="appShell">
  <div class="main" id="pageBody">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <div>
        <div class="label-tech">Sessão de Contagem</div>
        <div class="topbar-title" id="audTitulo">Carregando...</div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <div id="statusDot" style="width:12px;height:12px;border-radius:50%;background:var(--success);box-shadow: 0 0 10px var(--success);"></div>
        <button class="btn btn-ghost" onclick="pausar()">Pausar</button>
        <button class="btn btn-primary" onclick="confirmarFinalizar()">Finalizar</button>
      </div>
    </div>

    <div class="count-layout">
      <!-- PAINEL DE ENTRADA -->
      <div class="count-panel">
        <div class="count-input-zone">
          <div style="display:flex; gap:8px; margin-bottom: 16px; background: var(--surface-alt); padding: 6px; border-radius: var(--radius-sm);">
            <div class="btn btn-ghost" style="flex:1; justify-content:center; border:none; background:var(--surface);" id="tabManual" onclick="setModo('manual')">Teclado</div>
            <div class="btn btn-ghost" style="flex:1; justify-content:center; border:none;" id="tabScanner" onclick="setModo('scanner')">Leitor</div>
            <div class="btn btn-ghost" style="flex:1; justify-content:center; border:none;" id="tabCamera" onclick="setModo('camera')">Câmera</div>
          </div>

          <div id="scannerContainer">
            <video id="scannerVideo" autoplay playsinline muted></video>
            <div id="scannerOverlay"><div id="scannerLine"></div></div>
            <div id="scannerStatus" style="position: absolute; bottom: 8px; width:100%; text-align:center; color:#fff; font-family:var(--font-mono); font-size:12px;">Aponte para o código</div>
          </div>

          <div class="form-group" id="groupBusca">
            <label class="form-label">Código / Nome / Barras</label>
            <input class="input-field" id="codigoInput" placeholder="Digite..." autocomplete="off" oninput="onCodigoInput(this.value)" onkeydown="onCodigoKey(event)"/>
          </div>

          <div id="sugestoes" style="display:none; background:var(--surface-hover); border-radius:var(--radius-sm); margin-bottom:12px; overflow-y:auto; max-height:160px; border:1px solid var(--border-strong);"></div>

          <div id="productPreview" style="display:none; background:var(--surface-alt); border-radius:var(--radius-sm); padding:16px; margin-bottom:16px; border: 1px solid var(--primary-light);">
            <div class="mono" id="previewCod" style="font-size: 0.8rem; color: var(--text-muted);"></div>
            <div id="previewNome" style="font-weight: 800; font-size: 1.1rem; margin: 4px 0;"></div>
            <div id="previewUnit" class="label-tech"></div>
            <div id="previewStock" style="margin-top: 8px; color: var(--warning); font-size: 0.8rem; font-weight: 600;"></div>
          </div>

          <div class="form-group" id="groupQtd">
            <label class="form-label">Quantidade Contada</label>
            <input class="input-field" style="font-family: var(--font-mono); font-size: 2rem; font-weight: 800; text-align: center; color: var(--primary);" id="qtdInput" type="number" placeholder="0" min="0" step="0.01" onkeydown="onQtdKey(event)"/>
          </div>

          <button class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;" id="saveBtn" onclick="salvarItem()">Salvar Contagem (Enter)</button>
        </div>

        <div style="padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface-alt); display: flex; justify-content: space-between; align-items: center;">
          <span class="label-tech">Progresso</span>
          <span style="color: var(--primary); font-family: var(--font-mono); font-weight: 700;" id="pctProgresso">0%</span>
        </div>
      </div>

      <!-- PAINEL DA LISTA -->
      <div class="card" style="margin:0; display:flex; flex-direction:column;">
        <div class="card-header">
          <span class="card-title">Itens Registrados</span>
          <input class="input-field" style="width:200px; padding:8px 12px; font-size:0.8rem;" placeholder="Filtrar tabela..." oninput="filtrarLista(this.value)"/>
        </div>
        <div class="tabela-container" style="flex:1; border:none; border-radius:0;">
          <table>
            <thead><tr><th>Código</th><th>Produto</th><th>Qtd</th><th>Ação</th></tr></thead>
            <tbody id="detailTable">
              <tr class="tr-empty"><td colspan="4">Nenhum item contado ainda.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { requireAuth, getPerfil } from './js/auth.js';
import { showToast, showLoading, hideLoading, escapeHtml, fmtNum, debounce, fmConfirm } from './js/ui.js';
import { buscarProdutoUnificado, buscarProdutoPorCodigo, buscarProdutoPorBarras } from './js/produtos.js';
import { buscarAuditoria, progresso } from './js/auditorias.js';
import { registrarContagem, registrarScannerLeitura, buscarItemContado, editarContagem, listarItensContados } from './js/contagem.js';
import { initOfflineSync, isOnline, registrarOffline } from './js/offline.js';
import supabase from './js/supabaseClient.js';

(async () => {
  const auth = await requireAuth();
  if (!auth) { window.location.href = 'login.html'; return; }
  
  const perfil = getPerfil();
  const params = new URLSearchParams(location.search);
  window.auditoriaId = params.get('id');
  if (!window.auditoriaId) { window.location.href = 'app.html?tela=auditorias'; return; }

  initOfflineSync(({ online }) => {
    const dot = document.getElementById('statusDot');
    if (dot) dot.style.background = !online ? 'var(--warning)' : 'var(--success)';
  });

  window.modo = 'manual';
  window.produtoAtivo = null;
  window.pendingConflito = null;
  window._editItemId = null;
  window._sessList = [];
  window.empresaId = null;

  showLoading();
  try {
    const auditoria = await buscarAuditoria(window.auditoriaId);
    if (!auditoria) {
        showToast('Auditoria não encontrada.', 'error');
        setTimeout(() => { window.location.href = 'app.html?tela=auditorias'; }, 1500);
        return;
    }
    if (auditoria.status !== 'em_andamento') {
        showToast('Esta auditoria não está ativa.', 'warning');
        setTimeout(() => { window.location.href = 'app.html?tela=auditorias'; }, 1500);
        return;
    }
    window.empresaId = auditoria.empresa_id;
    document.getElementById('audTitulo').textContent = auditoria.numero_auditoria;
    
    const historico = await listarItensContados(window.auditoriaId, { limit: 5000 });
    if (historico && historico.data) {
        window._sessList = historico.data.map(i => ({
            id: i.id, codigo: i.produtos?.codigo_produto ?? '', nome: i.produtos?.nome_produto ?? '',
            qtd: i.quantidade_contada, offline: false
        }));
    }
    renderDetailTable();
    await atualizarProgresso();
    
  } catch (err) { 
      showToast(err.message, 'error'); 
  } finally { 
      hideLoading(); 
      const inputCode = document.getElementById('codigoInput');
      if (inputCode) inputCode.focus(); 
  }

  window.setModo = function(m) {
    window.modo = m;
    document.getElementById('tabManual').style.background = m === 'manual' ? 'var(--surface)' : 'transparent';
    document.getElementById('tabScanner').style.background = m === 'scanner' ? 'var(--surface)' : 'transparent';
    document.getElementById('tabCamera').style.background = m === 'camera' ? 'var(--surface)' : 'transparent';

    const cam = document.getElementById('scannerContainer');
    if (m === 'camera') {
      document.getElementById('groupQtd').style.display = 'none';
      document.getElementById('groupBusca').style.display = 'none';
      document.getElementById('saveBtn').textContent = 'Câmera Ativa...';
      cam.style.display = 'block'; iniciarCamera();
    } else {
      pararCamera(); cam.style.display = 'none';
      document.getElementById('groupBusca').style.display = 'flex';
      if (m === 'scanner') {
        document.getElementById('groupQtd').style.display = 'none';
        document.getElementById('saveBtn').textContent = 'Aguardando Leitor (+1)';
      } else {
        document.getElementById('groupQtd').style.display = 'flex';
        document.getElementById('saveBtn').textContent = 'Salvar Contagem (Enter)';
      }
      setTimeout(() => { const el = document.getElementById('codigoInput'); if(el) el.focus(); }, 100);
    }
  };

  let _cameraStream = null, _cameraLoop = null, _ultimoBarcode = '', _ultimoTs = 0;
  async function iniciarCamera() {
    if (!('BarcodeDetector' in window)) { showToast('Câmera não suportada neste navegador.', 'error'); return; }
    try {
      _cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.getElementById('scannerVideo');
      video.srcObject = _cameraStream; await video.play();
      const detector = new BarcodeDetector({ formats: ['ean_13','code_128','qr_code'] });
      _cameraLoop = setInterval(async () => {
        if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
        try {
          const barcodes = await detector.detect(video);
          if (!barcodes.length) return;
          const code = barcodes[0].rawValue, now = Date.now();
          if (code === _ultimoBarcode && now - _ultimoTs < 2000) return;
          _ultimoBarcode = code; _ultimoTs = now;
          const p = await buscarProdutoPorBarras(window.empresaId, code) ?? await buscarProdutoPorCodigo(window.empresaId, code);
          if (p) { selecionarProduto(p); await _persistir(p, 1, 'somar'); showToast(`+1 ${p.nome_produto}`, 'success'); } 
          else showToast(`Não encontrado: ${code}`, 'warning');
        } catch (err) {}
      }, 300);
    } catch (err) { showToast('Sem permissão para câmera.', 'error'); }
  }
  function pararCamera() { if (_cameraLoop) clearInterval(_cameraLoop); if (_cameraStream) _cameraStream.getTracks().forEach(t => t.stop()); }
  window.addEventListener('beforeunload', pararCamera);

  const buscarDebounced = debounce(async (termo) => {
    if (termo.length < 2) { document.getElementById('sugestoes').style.display = 'none'; return; }
    try {
      const pds = await buscarProdutoUnificado(window.empresaId, termo);
      if (pds.length === 1) { selecionarProduto(pds[0]); document.getElementById('sugestoes').style.display = 'none'; } 
      else if (pds.length > 1) {
        const s = document.getElementById('sugestoes'); s.style.display = 'block';
        s.innerHTML = pds.map(p => `<div style="padding:12px; cursor:pointer; border-bottom:1px solid var(--border);" onclick='window._selecionarProdutoById(${JSON.stringify(p).replace(/"/g,"&quot;")})'><span class="mono">${p.codigo_produto}</span> - ${p.nome_produto}</div>`).join('');
      } else { document.getElementById('sugestoes').style.display = 'none'; window.produtoAtivo = null; document.getElementById('productPreview').style.display = 'none'; }
    } catch (err) {}
  }, 250);

  window.onCodigoInput = function(v) { window.produtoAtivo = null; document.getElementById('productPreview').style.display = 'none'; buscarDebounced(v); };
  window.onCodigoKey = async function(e) {
    if (e.key === 'Enter') {
      if (window.produtoAtivo) { if (window.modo === 'scanner') await salvarItem(); else document.getElementById('qtdInput').focus(); return; }
      const t = document.getElementById('codigoInput').value.trim();
      if (t) {
        const p = await buscarProdutoPorCodigo(window.empresaId, t) ?? await buscarProdutoPorBarras(window.empresaId, t);
        if (p) { selecionarProduto(p); if (window.modo === 'scanner') await salvarItem(); else document.getElementById('qtdInput').focus(); }
        else showToast('Produto não encontrado.', 'warning');
      }
    }
  };
  window.onQtdKey = function(e) { if (e.key === 'Enter') salvarItem(); };
  window._selecionarProdutoById = function(p) { selecionarProduto(p); document.getElementById('sugestoes').style.display = 'none'; document.getElementById('qtdInput').focus(); };

  async function selecionarProduto(p) {
    window.produtoAtivo = p;
    document.getElementById('previewCod').textContent = p.codigo_produto;
    document.getElementById('previewNome').textContent = p.nome_produto;
    document.getElementById('previewUnit').textContent = p.unidade_medida ?? 'UN';
    const ex = await buscarItemContado(window.auditoriaId, p.id);
    document.getElementById('previewStock').textContent = ex ? `Já contado: ${ex.quantidade_contada}` : 'Novo registro';
    document.getElementById('productPreview').style.display = 'block';
  }

  window.salvarItem = async function() {
    if (!window.produtoAtivo) return showToast('Selecione um produto.', 'warning');
    const qtd = window.modo === 'scanner' ? 1 : parseFloat(document.getElementById('qtdInput').value);
    if (window.modo !== 'scanner' && (isNaN(qtd) || qtd < 0)) return showToast('Quantidade inválida.', 'warning');
    const btn = document.getElementById('saveBtn'); btn.disabled = true;
    try {
      const ex = await buscarItemContado(window.auditoriaId, window.produtoAtivo.id);
      if (ex && window.modo !== 'scanner') {
        window.pendingConflito = { produto: window.produtoAtivo, qtd, ex };
        document.getElementById('conflictMsg').innerHTML = `O produto <strong>${window.produtoAtivo.nome_produto}</strong> já tem <strong>${ex.quantidade_contada}</strong> registrados. Somar ou Substituir?`;
        document.getElementById('conflictModal').classList.add('active');
        btn.disabled = false; return;
      }
      await _persistir(window.produtoAtivo, qtd, window.modo === 'scanner' ? 'somar' : 'novo');
    } catch (err) { showToast(err.message, 'error'); btn.disabled = false; }
  };

  window.resolverConflito = async function(acao) {
    document.getElementById('conflictModal').classList.remove('active');
    if (!window.pendingConflito) return;
    const { produto, qtd } = window.pendingConflito; window.pendingConflito = null;
    await _persistir(produto, qtd, acao);
  };

  async function _persistir(produto, qtd, acao) {
    const btn = document.getElementById('saveBtn'); btn.disabled = true;
    try {
      let item;
      if (isOnline()) { item = await registrarContagem({ auditoriaId: window.auditoriaId, produtoId: produto.id, quantidade: qtd, usuarioId: perfil.id, acao }); } 
      else { await registrarOffline({ auditoriaId: window.auditoriaId, produtoId: produto.id, quantidade: qtd, usuarioId: perfil.id, acao }); item = { id: 'offline', produtos: produto, quantidade_contada: qtd, data_registro: new Date().toISOString() }; }
      
      document.getElementById('codigoInput').value = ''; document.getElementById('qtdInput').value = '';
      document.getElementById('productPreview').style.display = 'none'; window.produtoAtivo = null;
      document.getElementById('codigoInput').focus();
      
      const entry = { id: item.id, codigo: produto.codigo_produto, nome: produto.nome_produto, qtd: item.quantidade_contada };
      const idx = window._sessList.findIndex(i => i.codigo === entry.codigo);
      if (idx >= 0) window._sessList.splice(idx, 1);
      window._sessList.unshift(entry); renderDetailTable(); await atualizarProgresso();
      showToast('Salvo!', 'success', 1000);
    } catch (err) { showToast(err.message, 'error'); } finally { btn.disabled = false; }
  }

  window.filtrarLista = function(q) { window._filtroLista = q.toLowerCase(); renderDetailTable(); };
  function renderDetailTable() {
    const tbody = document.getElementById('detailTable');
    const f = window._filtroLista;
    const lista = f ? window._sessList.filter(i => i.codigo.toLowerCase().includes(f) || i.nome.toLowerCase().includes(f)) : window._sessList;
    if (!lista.length) { tbody.innerHTML = `<tr class="tr-empty"><td colspan="4">Nenhum item contado ainda.</td></tr>`; return; }
    tbody.innerHTML = lista.map(item => `<tr><td class="mono">${item.codigo}</td><td style="font-weight:600;">${item.nome}</td><td class="mono" style="color:var(--primary); font-weight:800; font-size:1.1rem;">${fmtNum(item.qtd)}</td><td><button class="btn btn-ghost btn-sm" onclick="abrirEdicao('${item.id}', '${escapeHtml(item.nome)}', ${item.qtd})">Editar</button></td></tr>`).join('');
  }

  window.abrirEdicao = function(id, nome, qtd) {
    window._editItemId = id; document.getElementById('editProdName').textContent = nome;
    document.getElementById('editQtd').value = qtd; document.getElementById('editMotivo').value = '';
    document.getElementById('editModal').classList.add('active');
  };
  window.fecharEdicao = function() { document.getElementById('editModal').classList.remove('active'); };
  window.salvarEdicao = async function() {
    const nova = parseFloat(document.getElementById('editQtd').value); const mot = document.getElementById('editMotivo').value;
    if (isNaN(nova) || nova < 0) return showToast('Inválido', 'warning');
    showLoading();
    try {
      await editarContagem(window._editItemId, nova, perfil.id, mot);
      showToast('Atualizado!', 'success');
      const li = window._sessList.find(i => i.id === window._editItemId); if (li) li.qtd = nova;
      renderDetailTable(); fecharEdicao();
    } catch(err) { showToast(err.message, 'error'); } finally { hideLoading(); }
  };

  async function atualizarProgresso() {
    try {
      const { contados, totalProdutos, pct } = await progresso(window.auditoriaId);
      document.getElementById('pctProgresso').textContent = pct + '%';
    } catch (err) {}
  }

  window.confirmarFinalizar = async function() {
    const ok = await fmConfirm({ titulo: 'Finalizar Auditoria?', msg: 'Isso encerrará a contagem. Você deverá informar os saldos do ERP no próximo passo.', confirmTxt: 'Avançar', tipo: 'info' });
    if (ok) window.location.href = `estoque-sistema.html?id=${window.auditoriaId}`;
  };

  window.pausar = function() { window.location.href = 'app.html?tela=auditorias'; };

  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('active')); });
  document.addEventListener('click', e => { if (e.target.classList.contains('modal-backdrop')) e.target.classList.remove('active'); });
})();
</script>
</body>
</html>
