<script>try{var t=localStorage.getItem('audistock-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}try{var q=location.search;if(/[?&]demo=(1|vazio)(&|$)/.test(q)||!/[?&]demo=0(&|$)/.test(q)&&sessionStorage.getItem('audistock-demo'))document.documentElement.classList.add('demo-cedo')}catch(e){}</script>

<body>
<main class="tela-central"><span class="spinner" role="status" aria-label="Carregando"></span></main>
<script type="module">
// Sem sessão guardada no aparelho (nem demonstração aberta ou pedida com
// ?demo=), vai direto ao login, sem baixar a biblioteca do Supabase. Com
// sessão, confere se ela ainda vale; se algo falhar, o login explica.
let guardada = /[?&]demo=/.test(location.search);
try { guardada ||= !!sessionStorage.getItem('audistock-demo') || Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k)); } catch (_) {}
let session = null;
if (guardada) try { session = await (await import('./js/auth.js')).getSession(); } catch (_) {}
window.location.replace(session ? 'app.html' : 'login.html');
</script>
