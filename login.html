<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AudiStock — Login</title>
<script src="js/erros.js"></script>
<link rel="stylesheet" href="css/style.css"/>
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
.login-wrap { width: 100%; max-width: 420px; padding: 20px; animation: fade-in .4s ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.login-box { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow); }
.login-brand { text-align: center; margin-bottom: 32px; }
.login-brand-icon { width: 56px; height: 56px; background: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; box-shadow: 0 8px 25px var(--primary-glow); }
.login-brand-icon svg { width: 28px; height: 28px; color: #fff; }
.login-title { font-size: 1.8rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
.login-title span { color: var(--primary); }
.login-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-label); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
.login-error { background: var(--danger-light); border: 1px solid var(--danger); border-radius: var(--radius-sm); padding: 12px; font-size: 0.85rem; color: var(--danger); margin-bottom: 20px; display: none; }
.login-error.visible { display: block; }
.login-footer { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-label); margin-top: 24px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="login-wrap">
    <div class="login-box">
        <div class="login-brand">
            <div class="login-brand-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27,6.96 12,12.01 20.73,6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
            </div>
            <div class="login-title">Audi<span>Stock</span></div>
            <div class="login-sub">Auditoria & Logística</div>
        </div>
        <div class="login-error" id="loginError"></div>
        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input class="input-field" type="email" id="email" placeholder="seu@email.com" autocomplete="email"/>
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label">Senha</label>
            <input class="input-field" type="password" id="senha" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" id="loginBtn" onclick="fazerLogin()">
            Entrar no Sistema
        </button>
        <a class="btn btn-ghost" style="width: 100%; justify-content: center; padding: 12px; margin-top: 12px; text-decoration: none;" href="app.html?demo=1">
            Explorar a demonstração
        </a>
    </div>
    <div class="login-footer">AudiStock v2.0 · Supabase Edition</div>
</div>

<script type="module">
import { login } from './js/auth.js';
import { initTheme } from './js/ui.js';

initTheme();
const params = new URLSearchParams(location.search);
if (params.get('erro') === 'inativo') mostrarErro('Conta desativada. Contate o administrador.');

document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

window.fazerLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('loginBtn');
    if (!email || !senha) { mostrarErro('Preencha e-mail e senha.'); return; }

    btn.disabled = true; btn.textContent = 'Autenticando...'; esconderErro();
    try {
        await login(email, senha);
        window.location.href = 'app.html';
    } catch (err) {
        mostrarErro(err.message);
        btn.disabled = false; btn.textContent = 'Entrar no Sistema';
    }
};

function mostrarErro(msg) { const el = document.getElementById('loginError'); el.textContent = msg; el.classList.add('visible'); }
function esconderErro() { document.getElementById('loginError').classList.remove('visible'); }
</script>
</body>
</html>
