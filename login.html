<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Entrar · AudiStock</title>
<meta name="description" content="AudiStock: auditoria de estoque com contagem cega, divergências e relatórios."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Cpath d='M23 19.5v-7a1.6 1.6 0 0 0-.8-1.4l-5.4-3.1a1.6 1.6 0 0 0-1.6 0l-5.4 3.1a1.6 1.6 0 0 0-.8 1.4v7a1.6 1.6 0 0 0 .8 1.4l5.4 3.1a1.6 1.6 0 0 0 1.6 0l5.4-3.1a1.6 1.6 0 0 0 .8-1.4zM9.2 11.6 16 15.5l6.8-3.9M16 23.8v-8.3' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<script>try{var t=localStorage.getItem('audistock-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
<script src="js/erros.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<main class="tela-central">
    <div class="login-wrap">
        <div class="login-marca">
            <span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg></span>
            <span class="marca-nome">AudiStock</span>
        </div>

        <div class="login-box">
            <h1>Entrar</h1>
            <p>Auditoria de estoque para equipes de contagem.</p>

            <div class="aviso aviso-perigo login-erro" id="loginError" role="alert"></div>

            <form id="formLogin" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-input" type="email" id="email" autocomplete="email" placeholder="voce@empresa.com.br" aria-describedby="loginError"/>
                </div>
                <div class="form-group" style="margin-bottom:20px">
                    <label class="form-label" for="senha">Senha</label>
                    <input class="form-input" type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" aria-describedby="loginError"/>
                </div>
                <button type="submit" class="btn btn-primary btn-bloco" id="loginBtn">Entrar</button>
            </form>

            <div class="divisor">ou</div>
            <a class="btn btn-secondary btn-bloco" href="app.html?demo=1">Explorar a demonstração</a>
            <p class="login-demo-texto">Dados fictícios, sem cadastro. Nada do que você fizer é gravado.</p>
        </div>

        <p class="login-rodape">Contagem cega, divergências e relatórios em PDF, Excel e CSV.</p>
    </div>
</main>

<script type="module">
import { login } from './js/auth.js';
import { initTheme } from './js/ui.js';

initTheme();
const params = new URLSearchParams(location.search);
if (params.get('erro') === 'inativo') mostrarErro('Sua conta está desativada. Fale com o administrador do sistema.');

const email = document.getElementById('email');
const senha = document.getElementById('senha');
const btn = document.getElementById('loginBtn');

document.getElementById('formLogin').addEventListener('submit', async e => {
    e.preventDefault();
    [email, senha].forEach(c => c.removeAttribute('aria-invalid'));
    const vazio = !email.value.trim() ? email : !senha.value ? senha : null;
    if (vazio) {
        mostrarErro('Informe seu e-mail e sua senha para entrar.');
        vazio.setAttribute('aria-invalid', 'true');
        vazio.focus();
        return;
    }
    btn.disabled = true; btn.textContent = 'Entrando…'; esconderErro();
    try {
        await login(email.value.trim(), senha.value);
        window.location.href = 'app.html';
    } catch (err) {
        mostrarErro(err.message);
        btn.disabled = false; btn.textContent = 'Entrar';
    }
});

function mostrarErro(msg) { const el = document.getElementById('loginError'); el.textContent = msg; el.classList.add('visible'); }
function esconderErro() { document.getElementById('loginError').classList.remove('visible'); }
</script>
</body>
</html>
